name: Publish New Year website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: updates
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ilyasemenovya/mun
          ref: 1b0826e24204bf4c48e18dafef0f9736e7093f3a
          path: source
          persist-credentials: false
      - name: Prepare current page and booking form
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, json, shutil, re
          from pathlib import Path
          out = Path('public')
          shutil.copytree('source/site/new-year', out)
          release = Path('source/deploy/mun-finish-form.sh').read_text()
          block = release.split("<<'MUN_STAGE'\n", 1)[1].split('\nMUN_STAGE', 1)[0]
          assignment = next(n for n in ast.parse(block).body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'files' for t in n.targets))
          files = json.loads(ast.literal_eval(assignment.value.args[0]))
          for name in ('form.js', 'form.css', 'privacy.html', 'consent.html'):
              (out / name).write_text(files[name])
          s = (out / 'index.html').read_text()
          s = s.replace('</head>', '<link rel="stylesheet" href="form.css?v=booking-1"><script src="form.js?v=booking-1" defer></script></head>')
          s = s.replace('<form class="booking-card"', '<form data-accept-leads="true" class="booking-card"')
          consent = '<label class="form-consent"><input type="checkbox" name="consent" required><span>Даю <a href="consent.html" target="_blank" rel="noopener">согласие на обработку персональных данных</a>. <a href="privacy.html" target="_blank" rel="noopener">Политика обработки данных</a>.</span></label><div class="form-trap" aria-hidden="true"><label>Ваш сайт<input name="website" tabindex="-1" autocomplete="off"></label></div>'
          anchor = '<button class="button" type="submit"'
          assert s.count(anchor) == 1
          s = s.replace(anchor, consent + anchor)
          s = s.replace('id="form-note">', 'id="form-note" role="status" aria-live="polite">')
          s = s.replace('— 5 л', '— 3 л').replace('— 400 г', '— 240 г').replace('На 10 гостей', 'На 6 гостей').replace('two-menus-12', 'six-guests-1')
          data_path = out / 'menu-data.js'
          menus = json.loads(data_path.read_text().split('=', 1)[1].strip().rstrip(';'))
          weights = {'500 г': '300 г', '700 г': '420 г', '1 кг': '600 г', '850 г': '480 г', '600 г': '360 г', '800 г': '480 г'}
          for groups in menus.values():
              for group in groups:
                  group['note'] = group['note'].replace('10 гостей', '6 гостей')
                  for dish in group['dishes']:
                      if group['id'] in ('cold', 'hot'):
                          dish['weight'] = weights[dish['weight']]
                      if dish['name'] == 'Салат с лососем и миксом зелени':
                          dish['weight'] = '130 г'
                      dish['name'] = dish['name'].replace('Фруктовое ассорти с мандаринами', 'Сезонные фрукты с мандаринами')
          data_path.write_text('const banquetMenus=' + json.dumps(menus, ensure_ascii=False) + ';')
          s = s.replace('две банкетные комнаты до 20 гостей каждая', 'банкетная комната до 25 гостей').replace('2 комнаты · до 20 гостей в каждой', 'до 25 гостей').replace('Банкетные комнаты', 'Банкетная комната').replace('Профессиональный звук и караоке в каждой комнате.', 'Профессиональный звук и караоке.')
          s = s.replace('data-hall="Банкетная комната"', 'data-hall="Банкетные комнаты"').replace('<option>Банкетная комната</option>', '<option value="Банкетные комнаты">Банкетная комната</option>')
          assert '113166324' not in s
          s = s.replace('</head>', "<script type=\"text/javascript\">(function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();for(var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r){return;}}k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})(window,document,'script','https://mc.yandex.ru/metrika/tag.js?id=113166324','ym');ym(113166324,'init',{ssr:true,webvisor:true,clickmap:true,ecommerce:'dataLayer',referrer:document.referrer,url:location.href,accurateTrackBounce:true,trackLinks:true});document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('.booking-card').forEach(function(form){form.classList.add('ym-hide-content');form.addEventListener('booking:sent',function(){try{if(typeof window.ym==='function'){window.ym(113166324,'reachGoal','allbids');}}catch(e){}});});});</script>" + '</head>')
          s = s.replace('</body>', "<noscript><div><img src=\"https://mc.yandex.ru/watch/113166324\" style=\"position:absolute; left:-9999px;\" alt=\"\" /></div></noscript>" + '</body>')
          s, removed = re.subn(r'<section\b[^>]*\bid="memories"[^>]*>.*?</section>', '', s, flags=re.S)
          assert removed == 1, 'Expected one memories section'
          (out / 'index.html').write_text(s)
          (out / '.nojekyll').touch()
          assert (out / 'assets/mun-logo.svg').is_file()
          PY
      - name: Publish updated PDF menus
        run: |
          cp updates/mun-banquet-menu-3500-photos.pdf public/assets/menu-3500.pdf
          cp updates/mun-banquet-menu-4000-photos.pdf public/assets/menu-4000.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
